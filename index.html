<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حلقة for ودالة range</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* اتجاه التصميم: غرفة تحكم مرورية هادئة — شريط إشارات، بطاقات بيضاء، ومحرر داكن */
:root{
  --ink:#12203f; --ink2:#506082; --paper:#f2f4fa; --card:#ffffff; --line:#d8deec; --soft:#eaeefa;
  --brand:#2750d8; --brand2:#1b3aa8;
  --go:#12a150; --go-bg:#e4f6ec; --wait:#e89b00; --wait-bg:#fff2d2; --stop:#d8343a; --stop-bg:#fde7e8;
  --code:#0f1729; --code2:#18223b; --code-ink:#e8eefb;
  --f-body:"Thmanyah Sans","thmanyah","ثمانية","Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif; --f-mono:"JetBrains Mono","Consolas","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:500;line-height:1.7;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:var(--f-body);font-weight:800;letter-spacing:.6px}
.muted{color:var(--ink2)}
bdi.c{font-family:var(--f-mono);font-size:.86em;background:var(--soft);border-radius:6px;padding:0 6px;direction:ltr;unicode-bidi:isolate;color:#1c3796;white-space:nowrap}

/* شريط علوي */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--stop) 0 33.3%,var(--wait) 33.3% 66.6%,var(--go) 66.6%) 1}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.05rem;text-align:start}
.logo svg{flex:none}
.logo small{display:block;font-weight:500;opacity:.7;font-size:.78rem;line-height:1.2}
.prog{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:.85rem}
.prog .track{width:130px;height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .5s}
.tb{padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.12);font-size:.85rem;font-weight:700}
.tb:hover{background:rgba(255,255,255,.22)}
main{max-width:1120px;margin:0 auto;padding:22px 20px 70px}

/* الرئيسية */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:26px;align-items:center;margin-bottom:34px}
.hero h1{font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.2;font-weight:800;text-wrap:balance}
.hero p{margin-top:12px;color:var(--ink2);font-size:1.08rem;max-width:34em}
.hero .acts{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.hero .sig{justify-self:center;background:var(--ink);border-radius:26px;padding:20px 26px;display:flex;gap:22px;align-items:center;color:#fff;box-shadow:0 10px 0 #0a1330}
.hero .sig svg{display:block}
.hero .rules{font-size:.82rem;display:grid;gap:8px;max-width:180px;line-height:1.4}
.hero .rules b{display:block;font-size:.9rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;box-shadow:0 5px 0 var(--brand2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brand2)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.go{background:var(--go);box-shadow:0 5px 0 #0c7a3c}
.btn.sm{padding:7px 16px;font-size:.9rem;box-shadow:0 3px 0 var(--brand2);border-radius:11px}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;border-bottom:2px solid var(--line);padding-bottom:8px}
.sec-h .k{font:800 .8rem var(--f-body);background:var(--ink);color:#fff;border-radius:8px;padding:2px 10px;letter-spacing:1px}
.sec-h h2{font-size:1.45rem}
.sec-h span.s{color:var(--ink2);font-size:.9rem;direction:ltr;unicode-bidi:isolate}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.st{position:relative;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px 16px 16px;display:grid;gap:8px;border-inline-start:8px solid var(--c);box-shadow:0 2px 0 var(--line);transition:transform .12s,box-shadow .12s}
.st:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--line)}
.st .top{display:flex;align-items:center;gap:10px}
.st .n{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.st .e{font-size:.72rem;color:var(--ink2)}
.st h3{font-size:1.15rem;line-height:1.35}
.st p{font-size:.88rem;color:var(--ink2);line-height:1.5}
.st .meta{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--ink2)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--go)}
.dots i.s{background:var(--wait)}

/* صفحة المحطة */
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.crumb h1{font-size:1.5rem;line-height:1.3}
.crumb .en{font-size:.75rem;color:#fff;background:var(--c);padding:2px 12px;border-radius:99px}
.stepper{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 18px;align-items:center}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:.9rem;position:relative;display:grid;place-items:center}
.stepper button.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.1)}
.stepper button.d{border-color:var(--go);color:var(--go)}
.stepper button.on.d{color:#fff}
.stepper .tr{width:auto;padding:0 14px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 5px 0 var(--line)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:.78rem;font-weight:800;border-radius:99px;padding:2px 12px;background:var(--soft);color:var(--ink2)}
.stmt{font-size:clamp(1.25rem,2.8vw,1.75rem);line-height:1.75;font-weight:700;margin:8px 0}
.code{direction:ltr;text-align:left;background:var(--code);color:var(--code-ink);border-radius:16px;padding:14px 18px;margin:12px 0;font:600 1.02rem/1.7 var(--f-mono);overflow:auto;box-shadow:0 4px 0 #070c1b;tab-size:4;white-space:pre}
.outv{direction:ltr;text-align:left;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:8px 14px;font:600 .98rem/1.65 var(--f-mono)}
.outv .ln{unicode-bidi:plaintext;text-align:start}
.t-c{color:#7f8db3;font-style:italic}.t-s{color:#9be28b}.t-k{color:#ff9d6b;font-weight:800}.t-f{color:#7ad1ff}.t-n{color:#f5d76e}
.lesson-body{font-size:1.1rem}
.lesson-body ul{margin:8px 0;padding-inline-start:22px}
.lesson-body li{margin:4px 0}
.ask{background:var(--wait-bg);border-radius:12px;padding:8px 14px;margin-top:10px}
.note{margin-top:10px;font-weight:700;color:var(--brand2)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.pair .lbl{font-size:.8rem;font-weight:800;color:var(--ink2);margin-bottom:2px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.sum3 div{background:var(--soft);border-radius:16px;padding:14px;display:grid;gap:4px}
.sum3 b{font:800 1.3rem var(--f-mono);direction:ltr;text-align:start;color:var(--brand2)}
.sum3 span{font-size:.95rem;line-height:1.5}

/* خيارات الاستجابة */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.opts.four{grid-template-columns:repeat(2,1fr)}
.o{border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:104px;background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-weight:800;text-align:center;transition:transform .08s}
.o:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.o.g{background:var(--go);border-color:#0c7a3c;color:#fff;box-shadow:0 5px 0 #0c7a3c}
.o.y{background:var(--wait);border-color:#b57a00;color:#3a2700;box-shadow:0 5px 0 #b57a00}
.o.r{background:var(--stop);border-color:#a71f25;color:#fff;box-shadow:0 5px 0 #a71f25}
.o .sym{font-size:1.9rem;line-height:1}
.o .sub{font-size:.76rem;font-weight:600;opacity:.9;line-height:1.3}
.o.txt{flex-direction:row;justify-content:flex-start;text-align:start;gap:12px;padding:10px 14px}
.o.txt .tx{font-size:1.08rem;font-weight:700;flex:1}
.o .L{min-width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif;font-weight:900}
.o.pick{outline:5px solid var(--ink);outline-offset:3px}
.o.dim{opacity:.35}
.o.right{outline:5px solid var(--go);outline-offset:3px;opacity:1}
.o.right:not(.g):not(.y):not(.r){background:var(--go-bg);border-color:var(--go)}
.o svg.fig{height:78px;width:auto}
.conf5{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.conf5 button{flex:1 1 130px;border:3px solid var(--line);border-radius:16px;background:var(--card);padding:8px;font-size:.82rem;font-weight:700;box-shadow:0 4px 0 var(--line)}
.conf5 button b{display:block;font-size:1.5rem;color:var(--brand)}
.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:18px}
.reveal{margin-top:18px;border-radius:18px;background:var(--soft);border:2px solid var(--brand);padding:14px 18px;animation:rise .35s both}
.reveal .v{font-size:1.3rem;font-weight:800}
.reveal .v.ok{color:var(--go)}.reveal .v.no{color:var(--stop)}
.reveal .sb{margin-top:6px;background:#fff;border-radius:12px;padding:8px 14px;border-inline-start:6px solid var(--wait)}
.reveal .sb.h{border-color:var(--go)}
.lean{display:inline-block;border-radius:99px;padding:0 12px;color:#fff;font-weight:800;margin-inline-start:6px}
.lean.g{background:var(--go)}.lean.y{background:var(--wait);color:#3a2700}.lean.r{background:var(--stop)}
.tally{margin-top:12px;background:#fff;border-radius:14px;padding:8px 14px}
.tally h4{margin:0 0 4px;font-size:.92rem}
.trow{display:flex;align-items:center;gap:8px;margin:3px 0}
.trow button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800}
.trow .bar2{flex:1;height:16px;background:var(--soft);border-radius:99px;overflow:hidden}
.trow .bar2 i{display:block;height:100%;transition:width .4s}
.spin{display:grid;place-items:center;padding:6px}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* مختبر بايثون */
.lab{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);overflow:hidden}
.lab-h{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--code2);color:#fff;flex-wrap:wrap}
.lab-h .snake{width:30px;height:30px;flex:none}
.lab-h b{font-size:1.05rem}
.lab-h .stt{margin-inline-start:auto;font-size:.82rem;font-weight:800;padding:2px 12px;border-radius:99px;background:rgba(255,255,255,.14)}
.lab-h .stt.ok{background:var(--go)}
.lab-b{padding:16px 20px 20px;display:grid;gap:14px}
.task{font-size:1.1rem;font-weight:700;line-height:1.7}
.lab-g{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.ed{display:flex;direction:ltr;background:var(--code);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 #070c1b}
.gut{padding:12px 0;background:#0b1224;color:#5d6b92;text-align:right;font:500 .92rem/24px var(--f-mono);user-select:none;min-width:38px}
.gut i{display:block;height:24px;padding:0 9px;font-style:normal}
.gut i.bad{background:var(--stop);color:#fff}
.wrap{position:relative;flex:1;min-width:0}
.ed .hl,.ed textarea{margin:0;padding:12px 14px;font:600 .98rem/24px var(--f-mono);letter-spacing:0;white-space:pre;tab-size:4;direction:ltr;text-align:left;border:0}
.ed .hl{position:absolute;inset:0;overflow:hidden;color:var(--code-ink);pointer-events:none}
.ed textarea{position:relative;display:block;width:100%;min-height:168px;background:transparent;color:transparent;caret-color:#fff;resize:none;overflow-x:auto;overflow-y:hidden;outline-offset:-3px}
.ed textarea::selection{background:rgba(110,150,255,.4);color:transparent}
.side{display:grid;gap:12px}
.box{border-radius:14px;border:2px solid var(--line);background:#fff;padding:8px 12px}
.box .lbl{font-size:.78rem;font-weight:800;color:var(--ink2);margin-bottom:2px;display:flex;align-items:center;gap:8px}
.box .outv{border:0;padding:2px 0;max-height:240px;overflow:auto;background:none}
.box .lbl+div{margin-top:2px}
.box.exp{background:var(--go-bg);border-color:#b5e3c8}
.box.con{background:var(--code);border-color:var(--code);color:var(--code-ink)}
.box.con .lbl{color:#9fb0d8}
.box.con .outv{color:var(--code-ink)}
.box.con .outv .ln{color:var(--code-ink)}
#conb-x{}
.box.con.bad{background:#2a1015;border-color:var(--stop)}
.err{color:#ffb3b6;direction:rtl;text-align:start;line-height:1.6}
.err code{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;display:inline-block;background:rgba(255,255,255,.1);border-radius:6px;padding:0 6px;color:#ffd1d3}
.err p{color:#fff;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;direction:ltr;margin-top:6px;align-items:center}
.chips span{font:700 .85rem var(--f-mono);background:rgba(255,255,255,.14);border-radius:8px;padding:1px 9px}
.chips em{font-style:normal;font-size:.76rem;opacity:.7;font-family:var(--f-body)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.fb{border-radius:16px;padding:12px 16px;animation:rise .3s both}
.fb.ok{background:var(--go-bg);border:2px solid #86d3a6}
.fb.no{background:var(--wait-bg);border:2px solid #f0c56b}
.fb.er{background:var(--stop-bg);border:2px solid #f0a0a4}
.fb b.t{font-size:1.15rem}
.fb .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.fb .cmp div{background:#fff;border-radius:10px;padding:6px 10px}
.fb .cmp .outv{border:0;padding:0}
.outv .ln.diff{background:var(--stop-bg);border-radius:4px}
.sol{border-radius:16px;background:var(--soft);padding:12px 16px;border:2px dashed var(--brand)}
.sol .code{margin:8px 0}
.hidden{display:none!important}

/* ختام المحطة */
.done{text-align:center}
.done .stars{font-size:2.4rem;letter-spacing:8px;color:var(--wait)}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stats div{background:var(--soft);border-radius:16px;padding:10px 20px;min-width:140px}
.stats b{display:block;font-size:1.7rem;color:var(--brand)}

/* نوافذ */
#ov{position:fixed;inset:0;background:rgba(18,32,63,.9);display:none;place-items:center;z-index:60}
#ov.on{display:grid}
#ov .num{font:900 min(34vw,250px)/1 Arial,sans-serif;color:#fff;animation:zoom .7s both}
@keyframes zoom{from{transform:scale(2.4);opacity:0}30%{opacity:1}to{transform:scale(1)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50;padding:16px}
#modal.on{display:grid}
#modal .card{max-width:640px;max-height:88vh;overflow:auto}
#modal li{margin:6px 0}
.cf{position:fixed;top:-20px;width:11px;height:15px;z-index:70;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
svg.fig{overflow:visible;animation:breathe 1.9s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px)}}
svg.fig .em{animation:wig 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{50%{transform:rotate(14deg) scale(1.1)}}
svg.fig .spn{animation:rot 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rot{to{transform:rotate(360deg)}}
svg.fig .au{animation:up 1s ease-in-out infinite}svg.fig .ad{animation:dn 1s ease-in-out infinite}
@keyframes up{50%{transform:translateY(-6px)}}@keyframes dn{50%{transform:translateY(6px)}}

@media(max-width:820px){
  .hero{grid-template-columns:1fr}.hero .sig{order:-1}
  .lab-g{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.sum3{grid-template-columns:1fr}
  .prog .track{width:70px}.logo small{display:none}.card{padding:16px}.fb .cmp{grid-template-columns:1fr}
}
@media(max-width:560px){.logo span{display:none}}
@media(max-width:480px){.opts.four{grid-template-columns:1fr}main{padding:16px 14px 60px}.bar-in{padding:8px 14px;gap:8px}.tb{padding:5px 9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{.bar,#ov,#modal,.cf{display:none!important}}

/* محطات الاستجابة الحركية */
.zones{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.zn{padding:4px 12px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-size:.82rem;font-weight:700}
.zn.on{background:var(--brand);color:#fff;border-color:var(--brand)}.zn.done{background:#dff3a0;border-color:#c8dc28;color:#2c3a00}
.steps{display:flex;gap:6px;direction:ltr;justify-content:center;margin:8px 0 10px;flex-wrap:wrap}
.stp{padding:5px 16px;border-radius:99px;background:var(--soft);font:800 .85rem Arial,sans-serif;letter-spacing:.5px;opacity:.6;transition:.3s}
.stp.on{background:var(--brand);color:#fff;opacity:1;transform:scale(1.1)}.stp.done{background:#dff3a0;color:#2c3a00;opacity:1}
.ring{width:90px;height:90px;margin:8px auto;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:10}.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--brand);stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:0;animation:ringgo linear forwards}
@keyframes ringgo{to{stroke-dashoffset:264}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem}
.bigemoji{font-size:3rem;line-height:1;display:grid;place-items:center;height:90px}
.banner{text-align:center;font-size:clamp(1.1rem,3vw,1.5rem);font-weight:700;margin:8px 0;padding:10px;border-radius:16px;background:var(--wait-bg);border:2px solid var(--wait)}
.mini{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.mini .it{display:flex;flex-direction:column;align-items:center;font-size:.85rem;text-align:center;max-width:170px;gap:2px}
.optsl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 var(--line);font-size:1.05rem;font-weight:700}
.opt .L{min-width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif;font-weight:900}
.opt.right{border-color:var(--go);background:var(--go-bg)}.opt.right .L{background:var(--go)}
.scale{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}

<body>
<div id="app"></div><div id="ov"></div><div id="modal"></div><div id="toast"></div>
<script>
/* مفسّر بايثون مصغّر: for و range و print فقط (مع متغيرات وعمليات حسابية ونصوص) */
(function (root) {
  class PyErr extends Error {
    constructor(kind, msg, line) { super(msg); this.kind = kind; this.line = line; }
  }
  const BANNED = new Set(['while','if','elif','else','def','break','continue','import','from','return','class','try','except','with','lambda','input','global','del','assert','raise','yield']);
  const IDS = /[\p{L}_]/u, IDC = /[\p{L}\p{N}_]/u;

  function stripComment(s) {
    let q = null;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) { if (c === '\\') i++; else if (c === q) q = null; }
      else if (c === '"' || c === "'") q = c;
      else if (c === '#') return s.slice(0, i);
    }
    return s;
  }

  function readStr(s, start, line) {
    const q = s[start]; let i = start + 1, raw = '';
    while (i < s.length && s[i] !== q) {
      if (s[i] === '\\' && i + 1 < s.length) { raw += s[i] + s[i + 1]; i += 2; }
      else raw += s[i++];
    }
    if (i >= s.length) throw new PyErr('SyntaxError', 'unterminated string literal', line);
    return { raw, end: i + 1 };
  }
  function unesc(raw) {
    return raw.replace(/\\(.)/g, (m, c) => c === 'n' ? '\n' : c === 't' ? '\t' : c === '\\' ? '\\' : c === '"' ? '"' : c === "'" ? "'" : m);
  }

  function tokenize(s, line) {
    const t = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ') { i++; continue; }
      if (/\d/.test(c)) {
        let j = i; while (j < s.length && /\d/.test(s[j])) j++;
        if (s[j] === '.') throw new PyErr('Unsupported', 'الأعداد العشرية خارج حدود هذا الدرس', line);
        if (j < s.length && IDS.test(s[j])) throw new PyErr('SyntaxError', 'invalid decimal literal', line);
        t.push({ t: 'num', v: parseInt(s.slice(i, j), 10) }); i = j; continue;
      }
      if (IDS.test(c)) {
        let j = i; while (j < s.length && IDC.test(s[j])) j++;
        const w = s.slice(i, j);
        if ((w === 'f' || w === 'F') && (s[j] === '"' || s[j] === "'")) {
          const r = readStr(s, j, line); t.push({ t: 'fstr', raw: r.raw }); i = r.end; continue;
        }
        t.push({ t: 'name', v: w }); i = j; continue;
      }
      if (c === '"' || c === "'") { const r = readStr(s, i, line); t.push({ t: 'str', v: unesc(r.raw) }); i = r.end; continue; }
      const two = s.slice(i, i + 2);
      if (two === '//' || two === '**') { t.push({ t: 'op', v: two }); i += 2; continue; }
      if ('+-*%(),='.includes(c)) { t.push({ t: 'op', v: c }); i++; continue; }
      if (c === '/') throw new PyErr('Unsupported', 'القسمة العشرية / خارج حدود هذا الدرس', line);
      throw new PyErr('SyntaxError', 'invalid character ' + c, line);
    }
    return t;
  }

  class Parser {
    constructor(tokens, line) { this.t = tokens; this.p = 0; this.line = line; }
    peek() { return this.t[this.p]; }
    isOp(v) { const k = this.t[this.p]; return k && k.t === 'op' && k.v === v; }
    err(m) { return new PyErr('SyntaxError', m || 'invalid syntax', this.line); }
    expect(v) { if (!this.isOp(v)) throw this.err("'" + v + "' expected"); this.p++; }
    done() { return this.p >= this.t.length; }
    expr() {
      let l = this.mul();
      while (this.isOp('+') || this.isOp('-')) { const op = this.t[this.p++].v; l = { k: 'bin', op, l, r: this.mul() }; }
      return l;
    }
    mul() {
      let l = this.unary();
      while (this.isOp('*') || this.isOp('//') || this.isOp('%')) { const op = this.t[this.p++].v; l = { k: 'bin', op, l, r: this.unary() }; }
      return l;
    }
    unary() {
      if (this.isOp('-') || this.isOp('+')) { const op = this.t[this.p++].v; return { k: 'un', op, e: this.unary() }; }
      const b = this.atom();
      if (this.isOp('**')) { this.p++; return { k: 'bin', op: '**', l: b, r: this.unary() }; }
      return b;
    }
    atom() {
      const tk = this.t[this.p++];
      if (!tk) throw this.err('unexpected end of line');
      if (tk.t === 'num') return { k: 'num', v: tk.v };
      if (tk.t === 'str') return { k: 'str', v: tk.v };
      if (tk.t === 'fstr') return this.fstr(tk.raw);
      if (tk.t === 'name') {
        if (this.isOp('(')) {
          this.p++; const args = [];
          while (!this.isOp(')')) {
            args.push(this.expr());
            if (this.isOp(',')) this.p++; else break;
          }
          this.expect(')');
          return { k: 'call', name: tk.v, args };
        }
        return { k: 'var', name: tk.v };
      }
      if (tk.t === 'op' && tk.v === '(') { const e = this.expr(); this.expect(')'); return e; }
      throw this.err();
    }
    fstr(raw) {
      const parts = []; let buf = '', i = 0;
      while (i < raw.length) {
        const c = raw[i];
        if (c === '{' && raw[i + 1] === '{') { buf += '{'; i += 2; }
        else if (c === '}' && raw[i + 1] === '}') { buf += '}'; i += 2; }
        else if (c === '{') {
          const j = raw.indexOf('}', i);
          if (j < 0) throw this.err("f-string: expecting '}'");
          const inner = raw.slice(i + 1, j);
          if (/[:!]/.test(inner.replace(/"[^"]*"|'[^']*'/g, ''))) throw new PyErr('Unsupported', 'تنسيق f-string المتقدم خارج حدود هذا الدرس', this.line);
          if (buf) { parts.push(unesc(buf)); buf = ''; }
          const sub = new Parser(tokenize(inner, this.line), this.line);
          const e = sub.expr(); if (!sub.done()) throw this.err();
          parts.push(e); i = j + 1;
        } else { buf += c; i++; }
      }
      if (buf) parts.push(unesc(buf));
      return { k: 'fstr', parts };
    }
    printArgs() {
      const args = [], kw = {};
      while (!this.done()) {
        const a = this.peek(), b = this.t[this.p + 1];
        if (a.t === 'name' && b && b.t === 'op' && b.v === '=') {
          this.p += 2;
          if (a.v !== 'sep' && a.v !== 'end') throw new PyErr('TypeError', "'" + a.v + "' is an invalid keyword argument for print()", this.line);
          kw[a.v] = this.expr();
        } else args.push(this.expr());
        if (this.isOp(',')) this.p++; else break;
      }
      if (!this.done()) throw this.err();
      return { args, kw };
    }
  }

  function parseProgram(src) {
    const raw = src.replace(/\r/g, '').split('\n');
    const lines = [];
    raw.forEach((l, i) => {
      const s = stripComment(l.replace(/\t/g, '    '));
      if (!s.trim()) return;
      lines.push({ no: i + 1, indent: s.match(/^ */)[0].length, text: s.trim() });
    });
    let pos = 0; const levels = [0];

    function stmt(L) {
      const text = L.text, first = (text.match(/^[\p{L}_][\p{L}\p{N}_]*/u) || [''])[0];
      if (BANNED.has(first)) {
        throw new PyErr('Unsupported', 'الأمر «' + first + '» خارج حدود هذا الدرس: نستخدم for و range فقط', L.no);
      }
      if (first === 'for') {
        const m = text.match(/^for\s+([\p{L}_][\p{L}\p{N}_]*)\s+in\s+(.*?)\s*(:?)$/u);
        if (!m) throw new PyErr('SyntaxError', 'invalid syntax', L.no);
        if (!m[3]) throw new PyErr('SyntaxError', "expected ':'", L.no);
        const rm = m[2].match(/^range\s*\((.*)\)$/s);
        if (!rm) throw new PyErr('Unsupported', 'في هذا الدرس نكتب for مع range فقط', L.no);
        const ps = new Parser(tokenize(rm[1], L.no), L.no), args = [];
        while (!ps.done()) { args.push(ps.expr()); if (ps.isOp(',')) ps.p++; else break; }
        if (!ps.done()) throw ps.err();
        return { type: 'for', v: m[1], args, line: L.no, body: null };
      }
      if (first === 'print') {
        const m = text.match(/^print\s*\((.*)\)$/s);
        if (!m) throw new PyErr('SyntaxError', "'(' was never closed", L.no);
        const ps = new Parser(tokenize(m[1], L.no), L.no);
        const r = ps.printArgs();
        return { type: 'print', args: r.args, kw: r.kw, line: L.no };
      }
      if (first === 'pass' && text === 'pass') return { type: 'pass', line: L.no };
      const am = text.match(/^([\p{L}_][\p{L}\p{N}_]*)\s*(\+=|-=|\*=|\/\/=|%=|=)(?!=)\s*(.*)$/u);
      if (am) {
        if (!am[3]) throw new PyErr('SyntaxError', 'invalid syntax', L.no);
        const ps = new Parser(tokenize(am[3], L.no), L.no), e = ps.expr();
        if (!ps.done()) throw ps.err();
        return { type: 'assign', name: am[1], op: am[2], e, line: L.no };
      }
      throw new PyErr('SyntaxError', 'invalid syntax', L.no);
    }

    function block(ind) {
      const out = [];
      while (pos < lines.length) {
        const L = lines[pos];
        if (L.indent < ind) {
          if (!levels.includes(L.indent)) throw new PyErr('IndentationError', 'unindent does not match any outer indentation level', L.no);
          break;
        }
        if (L.indent > ind) throw new PyErr('IndentationError', 'unexpected indent', L.no);
        pos++;
        const s = stmt(L);
        if (s.type === 'for') {
          const nx = lines[pos];
          if (!nx || nx.indent <= ind) throw new PyErr('IndentationError', 'expected an indented block', nx ? nx.no : L.no);
          levels.push(nx.indent);
          s.body = block(nx.indent);
          levels.pop();
        }
        out.push(s);
      }
      return out;
    }
    if (lines.length && lines[0].indent > 0) throw new PyErr('IndentationError', 'unexpected indent', lines[0].no);
    const prog = block(0);
    if (pos < lines.length) throw new PyErr('IndentationError', 'unexpected indent', lines[pos].no);
    return prog;
  }

  const tname = v => typeof v === 'number' ? 'int' : 'str';
  const pyStr = v => String(v);

  function ev(n, env, ctx, line) {
    switch (n.k) {
      case 'num': case 'str': case 'lit': return n.v;
      case 'fstr': return n.parts.map(p => typeof p === 'string' ? p : pyStr(ev(p, env, ctx, line))).join('');
      case 'var':
        if (!(n.name in env)) throw new PyErr('NameError', "name '" + n.name + "' is not defined", line);
        return env[n.name];
      case 'un': {
        const v = ev(n.e, env, ctx, line);
        if (typeof v !== 'number') throw new PyErr('TypeError', "bad operand type for unary " + n.op + ": 'str'", line);
        return n.op === '-' ? -v : v;
      }
      case 'call': {
        const a = n.args.map(x => ev(x, env, ctx, line));
        if (n.name === 'str' && a.length === 1) return pyStr(a[0]);
        if (n.name === 'len' && a.length === 1 && typeof a[0] === 'string') return a[0].length;
        if (n.name === 'abs' && a.length === 1 && typeof a[0] === 'number') return Math.abs(a[0]);
        if (n.name === 'int' && a.length === 1) {
          if (typeof a[0] === 'number') return a[0];
          if (/^\s*-?\d+\s*$/.test(a[0])) return parseInt(a[0], 10);
          throw new PyErr('ValueError', "invalid literal for int(): '" + a[0] + "'", line);
        }
        if (n.name === 'range') throw new PyErr('Unsupported', 'نستخدم range داخل سطر for فقط', line);
        throw new PyErr('NameError', "name '" + n.name + "' is not defined", line);
      }
      case 'bin': {
        const l = ev(n.l, env, ctx, line), r = ev(n.r, env, ctx, line), op = n.op;
        const ln = typeof l === 'number', rn = typeof r === 'number';
        if (op === '+') {
          if (ln && rn) return l + r;
          if (!ln && !rn) return l + r;
          throw new PyErr('TypeError', ln ? "unsupported operand type(s) for +: 'int' and 'str'" : 'can only concatenate str (not "int") to str', line);
        }
        if (op === '*') {
          if (ln && rn) return l * r;
          if (ln !== rn) { const s = ln ? r : l, k = ln ? l : r; return k > 0 ? (s.length * k > 2000 ? (() => { throw new PyErr('RuntimeError', 'too long', line); })() : s.repeat(k)) : ''; }
          throw new PyErr('TypeError', "can't multiply sequence by non-int of type 'str'", line);
        }
        if (!ln || !rn) throw new PyErr('TypeError', "unsupported operand type(s) for " + op + ": '" + tname(l) + "' and '" + tname(r) + "'", line);
        if (op === '-') return l - r;
        if (op === '//') { if (r === 0) throw new PyErr('ZeroDivisionError', 'integer division or modulo by zero', line); return Math.floor(l / r); }
        if (op === '%') { if (r === 0) throw new PyErr('ZeroDivisionError', 'integer modulo by zero', line); return ((l % r) + r) % r; }
        if (op === '**') {
          if (r < 0) throw new PyErr('Unsupported', 'الأسس السالبة خارج حدود هذا الدرس', line);
          const v = Math.pow(l, r); if (!Number.isSafeInteger(v)) throw new PyErr('RuntimeError', 'number too large', line); return v;
        }
      }
    }
    throw new PyErr('SyntaxError', 'invalid syntax', line);
  }

  function exec(stmts, env, ctx, depth) {
    for (const s of stmts) {
      if (++ctx.steps > ctx.max) throw new PyErr('RuntimeError', 'too many steps', s.line);
      if (s.type === 'print') {
        const vals = s.args.map(a => pyStr(ev(a, env, ctx, s.line)));
        const sep = s.kw.sep ? pyStr(ev(s.kw.sep, env, ctx, s.line)) : ' ';
        const end = s.kw.end ? pyStr(ev(s.kw.end, env, ctx, s.line)) : '\n';
        ctx.out += vals.join(sep) + end;
        if (ctx.out.length > 20000) throw new PyErr('RuntimeError', 'too much output', s.line);
      } else if (s.type === 'assign') {
        let v = ev(s.e, env, ctx, s.line);
        if (s.op !== '=') {
          if (!(s.name in env)) throw new PyErr('NameError', "name '" + s.name + "' is not defined", s.line);
          const cur = env[s.name], op = s.op.slice(0, -1);
          v = ev({ k: 'bin', op, l: { k: 'lit', v: cur }, r: { k: 'lit', v } }, env, ctx, s.line);
        }
        env[s.name] = v;
      } else if (s.type === 'for') {
        const a = s.args.map(e => ev(e, env, ctx, s.line));
        if (a.length < 1 || a.length > 3) throw new PyErr('TypeError', a.length < 1 ? 'range expected at least 1 argument, got 0' : 'range expected at most 3 arguments, got ' + a.length, s.line);
        a.forEach(x => { if (typeof x !== 'number') throw new PyErr('TypeError', "'str' object cannot be interpreted as an integer", s.line); });
        const start = a.length === 1 ? 0 : a[0], stop = a.length === 1 ? a[0] : a[1], step = a.length === 3 ? a[2] : 1;
        if (step === 0) throw new PyErr('ValueError', 'range() arg 3 must not be zero', s.line);
        const rec = depth === 0 && ctx.trace === null;
        if (rec) { ctx.trace = []; ctx.traceVar = s.v; ctx.traceRange = [start, stop, step]; }
        for (let v = start; step > 0 ? v < stop : v > stop; v += step) {
          if (rec && ctx.trace.length < 40) ctx.trace.push(v); else if (rec) ctx.traceMore = true;
          env[s.v] = v;
          if (++ctx.steps > ctx.max) throw new PyErr('RuntimeError', 'too many steps', s.line);
          exec(s.body, env, ctx, depth + 1);
        }
      }
    }
  }

  function collect(stmts, out) {
    for (const s of stmts) if (s.type === 'for') { out.push({ argc: s.args.length, v: s.v }); collect(s.body, out); }
    return out;
  }

  function runPy(src) {
    const res = { ok: false, lines: [], err: null, trace: null, traceVar: null, traceRange: null, traceMore: false, fors: [] };
    let prog;
    try {
      prog = parseProgram(String(src));
      res.fors = collect(prog, []);
      const ctx = { out: '', steps: 0, max: 20000, trace: null, traceVar: null, traceMore: false, traceRange: null };
      try { exec(prog, Object.create(null), ctx, 0); }
      finally {
        res.lines = normLines(ctx.out); res.trace = ctx.trace; res.traceVar = ctx.traceVar; res.traceMore = ctx.traceMore; res.traceRange = ctx.traceRange;
      }
      res.ok = true;
    } catch (e) {
      if (e instanceof PyErr) res.err = { kind: e.kind, msg: e.message, line: e.line };
      else res.err = { kind: 'InternalError', msg: String(e && e.message || e), line: 0 };
    }
    return res;
  }
  function normLines(out) {
    const l = out.split('\n').map(x => x.replace(/\s+$/, ''));
    while (l.length && l[l.length - 1] === '') l.pop();
    return l;
  }

    const k = e.kind, m = e.msg;
    if (k === 'IndentationError') {
      if (/expected an indented block/.test(m)) return 'بعد سطر for يجب أن يبدأ السطر التالي بمسافة بادئة (٤ مسافات) ليصبح داخل الحلقة.';
      if (/unexpected indent/.test(m)) return 'هذا السطر يبدأ بمسافة زائدة بلا داعٍ. احذفي المسافات الزائدة أو اجعليه داخل حلقة.';
      return 'مسافة هذا السطر لا تطابق أي مستوى سابق. اجعليها مثل بقية أسطر الحلقة (٤ مسافات) أو بلا مسافة لتخرجي من الحلقة.';
    }
    if (k === 'SyntaxError') {
      if (/expected ':'/.test(m)) return 'ينقص النقطتان ( : ) في نهاية سطر for.';
      if (/unterminated string/.test(m)) return 'علامة الاقتباس غير مغلقة: أغلقي النص بعلامة اقتباس مطابقة.';
      if (/never closed|'\)' expected/.test(m)) return 'قوس غير مغلق: راجعي أقواس print أو range.';
      return 'صيغة السطر غير صحيحة. راجعي الأقواس وعلامات الاقتباس والفواصل.';
    }
    if (k === 'NameError') { const v = (m.match(/'(.+?)'/) || [])[1]; return 'الاسم «' + v + '» غير معرَّف. تأكدي من كتابته كما في الحلقة أو عرّفيه قبل استخدامه. وإن كان نصًّا فضعيه بين علامتي اقتباس.'; }
    if (k === 'TypeError') {
      if (/concatenate|unsupported operand type\(s\) for \+/.test(m)) return 'لا يمكن جمع نص مع رقم بعلامة +. افصلي بينهما بفاصلة داخل print، مثل: print("طالبة", i).';
      if (/range expected at least/.test(m)) return 'range تحتاج إلى قيمة واحدة على الأقل داخل القوسين.';
      if (/range expected at most/.test(m)) return 'range تقبل حتى ثلاث قيم فقط: البداية، النهاية، الخطوة.';
      if (/interpreted as an integer/.test(m)) return 'قيم range يجب أن تكون أعدادًا صحيحة، وليست نصوصًا.';
      return 'نوع القيمة غير مناسب لهذه العملية.';
    }

    if (k === 'ZeroDivisionError') return 'لا يمكن القسمة على صفر.';
    if (k === 'RuntimeError') return 'الكود طلب عددًا كبيرًا جدًا من الخطوات أو المخرجات. راجعي قيم range.';
    if (k === 'Unsupported') return m;
    return 'حدث خطأ غير متوقع. راجعي الكود.';
  }

  return `<article class="card"><div class="qhead"><span class="pill">السؤال ${S.i + 1} من ${st.items.length}</span></div><h2 style="font-size:1.5rem;margin:6px 0">${it.title}</h2>
   <div class="lesson-body">${it.html}</div>
   ${it.code ? `<div class="pair" style="margin-top:8px"><div>${codeBlock(it.code)}</div><div>${it.output ? (outHidden ? `<div class="outv" style="min-height:90px;display:grid;place-items:center"><button class="btn sm" data-a="reshow">اكشفي الناتج</button></div>` : `<div class="lbl muted" style="font-weight:800;font-size:.8rem">الناتج</div>${outBlock(it.output)}`) : ''}</div></div>` : ''}
   ${it.note && !outHidden ? `<p class="note">${esc(it.note)}</p>` : ''}</article>${hasLab && it.lab ? labHTML(st.id + '-' + S.i, it.lab) : ''}`;
}
function questionPage(st, it) {
  if (TPRK.includes(st.kind)) return tprPage(st, it);
  const k = modeOf(st, it), opts = optsFor(st, it), four = k === 'abcd' || k === 'conf';
  const stage = k === 'conf' && S.pick && !S.rev;
  let body = `<div class="qhead"><span class="pill en">${st.kind === 'speed' ? it.label : st.en}</span><span class="pill">السؤال ${S.i + 1} من ${st.items.length}</span>${it.type ? `<span class="pill">${it.type}</span>` : ''}</div>
   <p class="stmt">${fmt(it.q)}</p>${it.code ? codeBlock(it.code) : ''}`;
  if (st.kind === 'tl-opinion' || st.kind === 'tl-show' || st.kind === 'tl-move') body += `<p class="muted" style="font-weight:700">${['g','y','r'].map(c => `<span class="lean ${c}">${st.legend[c]}</span>`).join(' ')}</p>`;
  if (k === 'spin') body += `<div class="spin">${fig('spin', { size:150 })}</div>`;
  else body += `<div class="opts ${four ? 'four' : ''}">${opts.map(o => {
    const cls = [o.cls || '', o.txt ? 'txt' : '', S.pick === o.id ? 'pick' : '', S.rev && S.pick && S.pick !== o.id ? 'dim' : '', S.rev && it.ans === o.id ? 'right' : ''].join(' ');
    return `<button class="o ${cls}" data-a="pick" data-v="${o.id}" ${S.rev || stage ? 'disabled' : ''}>${o.letter ? `<span class="L">${o.letter}</span>` : ''}${o.vis || ''}${o.txt ? `<span class="tx">${fmt(o.label)}${o.sub ? `<span class="sub" style="display:block;color:var(--ink2)">${o.sub}</span>` : ''}</span>` : `<span>${o.label}</span>${o.sub ? `<span class="sub">${o.sub}</span>` : ''}`}</button>`; }).join('')}</div>`;
  if (stage) body += `<p class="stmt" style="font-size:1.1rem;margin-top:16px">ما مدى ثقتك بإجابتك؟</p><div class="conf5">${window.TPR.find(s => s.id === 'conf').scale.map(c => `<button data-a="setconf" data-v="${c[0]}"><b>${c[0]}</b>${c[1]}</button>`).join('')}</div>`;
  if (!S.rev && !stage) body += `<div class="actions"><span class="muted">فكّري ثم اختاري${k === 'spin' ? '' : ' (أو اكشفي الحل مباشرة)'}</span><div class="tools"><button class="btn sm ghost" data-a="count">٣ … ٢ … ١</button><button class="btn sm" data-a="reveal">👁 اكشفي الحل</button></div></div>`;
  if (S.rev) body += revealHTML(st, it, k, opts);
  return `<article class="card">${body}</article>${S.rev && it.lab ? labHTML(st.id + '-' + S.i, it.lab) : ''}`;
}
function lampBox(c) { return `<div class="lampbox">${lightOn(c, 58)}</div>`; }
function revealHTML(st, it, k, opts) {
  const find = id => opts.find(o => o.id === id), aid = it.ans || it.lean, ao = find(aid);
  let head = '';
  const scored = it.ans && !it.evidence && it.ans !== 'spin';
  if (it.evidence) head = `<div class="v">بعد عرض الدليل: الإجابة ${optLabel(find(it.after))}</div>`;
  else if (scored) head = S.pick ? (S.pick === it.ans ? `<div class="v ok">✔ إجابة صحيحة: ${esc(optLabel(ao))}</div>` : `<div class="v no">✖ لنراجع معًا. الإجابة الصحيحة: ${esc(optLabel(ao))}</div>`) : `<div class="v">الإجابة: ${esc(optLabel(ao))}</div>`;
  else if (it.lean) head = `<div class="v">${S.pick ? `اخترتِ: <span class="lean ${/^[gyr]$/.test(S.pick) ? S.pick : ''}">${esc(optLabel(find(S.pick)))}</span> · ` : ''}الدليل يميل إلى: ${esc(optLabel(find(it.lean)))}</div><p class="muted">لكن رأيك مقبول إذا برّرتِه بدليل من الدرس.</p>`;
  else head = `<div class="v">${S.pick ? esc(optLabel(find(S.pick))) : ''}</div>`;
  let body = '';
  if (k === 'tl-move' && it.ans) body += `<div class="sb h"><b>الحركة:</b> ${st.moves[it.ans]}</div>`;
  if (it.why) body += `<div class="sb h"><b>${it.lean && !it.ans ? 'نقطة للنقاش' : 'لماذا؟'}</b> ${fmt(it.why)}</div>`;
  if (it.fix) body += `<div class="sb"><b>صحّحيها:</b> ${fmt(it.fix)}</div>`;
  if (it.hint) body += `<div class="sb h">💡 <b>دليل من الدرس:</b> ${fmt(it.hint)}</div>`;
  if (it.explain) body += `<div class="sb">${esc(it.explain)}</div>`;
  if (it.tip) body += `<div class="sb">🗣 ${esc(it.tip)}</div>`;
  if (k === 'conf' && S.conf && S.pick) {
    const ok = S.pick === it.ans, c = S.conf;
    body += `<div class="sb">ثقتك: <b>${c} من 5</b> — ${ok ? (c >= 4 ? 'إجابة صحيحة وثقة عالية، ممتاز!' : 'إجابتك صحيحة، ثقي بنفسك أكثر.') : (c >= 4 ? 'كنتِ واثقة لكن الإجابة تحتاج مراجعة، وهذه فرصة للتعلم.' : 'لا بأس، حيرتك طبيعية، راجعي التفسير ثم جرّبي المختبر.')}</div>`;
  }
  if (st.kind === 'tl-opinion') {
    const key = st.id + S.i, t = S.tally[key] || { g:0, y:0, r:0 }, tot = Math.max(1, t.g + t.y + t.r);
    body += `<div class="tally"><h4>📊 كم طالبة رفعت كل لون؟</h4>${['g','y','r'].map(c => `<div class="trow"><button data-a="tally" data-v="${key}|${c}|-1">−</button><b>${t[c]}</b><button data-a="tally" data-v="${key}|${c}|1">+</button><div class="bar2"><i style="width:${t[c] / tot * 100}%;background:var(--${c === 'g' ? 'go' : c === 'y' ? 'wait' : 'stop'})"></i></div><span style="min-width:140px">${st.legend[c]}</span></div>`).join('')}</div>`;
  }
  const lamp = it.ans && /^[gyr]$/.test(it.ans) ? lampBox(it.ans) : '';
  const wrong = scored && S.pick && S.pick !== it.ans;
  return `<div class="reveal${wrong ? ' shake' : ' bounce'}"><div class="rv">${lamp}<div style="flex:1">${head}${body}</div></div></div>`;
}
function challengePage(st) {
  const id = st.id + '-ch';
  return `<article class="card" style="border-top:6px solid ${st.color}"><div class="qhead"><span class="pill">تحدي نهاية المحطة</span></div><h2 style="font-size:1.5rem;margin:6px 0">اجمعي ما تعلمتِه في هذه المحطة</h2><p class="muted">هذا التحدي أطول قليلًا من تدريبات الأسئلة. اكتبي الحل بنفسك قبل أن تطلبي المساعدة.</p></article>${labHTML(id, st.challenge)}`;
}
function summaryPage(st) {
  const ids = labIds(st), d = ids.filter(x => SAVE.solved[x]).length, st5 = ids.filter(x => SAVE.solved[x] && SAVE.solved[x].star).length;
  const scoredKeys = st.items.map((it, i) => it.ans && !it.evidence && it.ans !== 'spin' ? st.id + '-' + i : null).filter(Boolean);
  const right = scoredKeys.filter(k => SAVE.scores[k]).length;
  const stars = Math.round(st5 / ids.length * 5);
  const nx = ALL[ALL.indexOf(st) + 1];
  return `<article class="card done"><h2>🏁 أنهيتِ محطة «${st.ar}»</h2><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</div>
   <div class="stats"><div><b>${d} من ${ids.length}</b>مختبرات محلولة</div><div><b>${st5}</b>حلول بلا مساعدة</div>${scoredKeys.length ? `<div><b>${right} من ${scoredKeys.length}</b>إجابات صحيحة</div>` : ''}</div>
   ${d < ids.length ? '<p class="muted">يمكنك الرجوع إلى أي سؤال من الأرقام في الأعلى وإكمال المختبرات الناقصة.</p>' : ''}
   <div class="actions" style="justify-content:center"><button class="btn ghost" data-a="home">الرئيسية</button>${nx ? `<button class="btn go" data-a="nextst">المحطة التالية: ${nx.ar}</button>` : ''}</div></article>`;
}
function renderStation() {
  const st = S.st, n = st.items.length, ids = labIds(st);
  const stepper = `<div class="stepper" style="--c:${st.color}">${st.items.map((_, i) => `<button class="${i === S.i ? 'on' : ''} ${SAVE.solved[ids[i]] ? 'd' : ''}" data-a="goto" data-v="${i}" aria-label="السؤال ${i + 1}">${i + 1}</button>`).join('')}<button class="tr ${S.i === n ? 'on' : ''} ${SAVE.solved[ids[n]] ? 'd' : ''}" data-a="goto" data-v="${n}">★ التحدي</button><button class="tr ${S.i > n ? 'on' : ''}" data-a="goto" data-v="${n + 1}">النتيجة</button></div>`;
  let page;
  if (S.i < 0) page = introPage(st);
  else if (S.i < n) page = st.kind === 'lesson' ? lessonPage(st, st.items[S.i]) : questionPage(st, st.items[S.i]);
  else if (S.i === n) page = challengePage(st); else page = summaryPage(st);
  const itn = S.i >= 0 && S.i < n ? st.items[S.i] : null, blocked = itn && TPRK.includes(st.kind) && !(S.t.stage === 3 && tprCanNext(st, itn));
  const nav = S.i >= 0 && S.i <= n ? `<div class="actions"><button class="btn ghost" data-a="prev">→ السابق</button>${blocked ? '<span></span>' : `<button class="btn" data-a="next">${S.i === n ? 'إنهاء المحطة ✔' : S.i === n - 1 ? 'إلى التحدي ←' : 'التالي ←'}</button>`}</div>` : '';
  return `<div class="crumb" style="--c:${st.color}"><button class="btn sm ghost" data-a="home">← الرئيسية</button><span class="en">${st.en}</span><h1>${st.ar}</h1></div>${roadHTML(st)}${zonesHTML(st)}${S.i < 0 ? '' : stepper}${page}${nav}`;
}
function render() {
  $('#app').innerHTML = bar() + `<main>${S.st ? renderStation() : renderHome()}</main>`;
  updateProg();
  if (S.st) {
    const n = S.st.items.length;
    if (S.i >= 0 && S.i < n) { const it = S.st.items[S.i], id = S.st.id + '-' + S.i; if (document.getElementById('lab-' + id)) initLab(id, it.lab); }
    else if (S.i === n) initLab(S.st.id + '-ch', S.st.challenge);
  }
}
function go(h) { try { history.replaceState(null, '', '#' + h); } catch (e) { try { location.hash = h; } catch (e2) {} } }
function applyHash() { const h = (location.hash || '').slice(1), st = ALL.find(s => s.id === h); if (st) { S.st = st; S.i = startIdx(st); } else S.st = null; reset(); render(); }
window.addEventListener('hashchange', applyHash);
applyHash();
window.__app = { S, A, render, LAB, SAVE, ALL };
})();

</script>
